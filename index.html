<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GREEN EYE – The Third Eye</title>
<style>
  body { margin:0; background:#000; color:#3f6; font-family:monospace;
         display:flex; align-items:center; justify-content:center;
         height:100vh; overflow:hidden; }
  #kep { width:80%; max-width:700px; text-align:center; }
  #cim { font-size:2.5em; text-shadow:0 0 20px #3f6; }
  #szoveg { font-size:1.2em; line-height:1.6; min-height:200px;
            white-space:pre-line; margin-top:30px; color:#cfc; }
  #tipp { position:fixed; bottom:20px; width:100%; text-align:center;
          color:#666; font-size:0.9em; }
</style>
</head>
<body>
<div id="kep">
  <div id="cim">GREEN EYE</div>
  <div id="szoveg"></div>
  <div id="tipp">[SPACE] – next page</div>
</div>
<script>
const pages = [
`THE THIRD EYE

1960s, night.
Simon, a pilot, drives toward the airport,
when he suddenly notices a green glowing circle...

The circle sucks him in.
He finds himself in an ancient jungle,
where he discovers the AMARU KANCHA:
the abandoned temple of the Serpent God.`,
`
INSIDE THE TEMPLE

Here he meets Adele, who became a victim
of the green circle the same way.

"I'm a teacher. One evening I went jogging
in the forest... I saw a glowing green circle.
As I got closer, it sucked me in...
and I found myself here."`,
`
THE PROPHECY OF THE SPIRIT

Suddenly a spirit appears:

"You must find the THIRD GREEN STONE,
or the Serpent God will break free!

Three plagues will strike civilization:
1. The reptiles will become intelligent
   humanoids and attack the cities.
2. The weak-minded will catch the reptile
   plague: green eyes, scaly skin --
   infecting everyone with their bite.
3. The Serpent God himself will appear
   and turn civilization into ruins."`,
`
ZACK, THE KEY

"The third stone can only be found by:
ZACK, the boy with the green eye on his forehead.
He is the last descendant of the Inca high priest,
living in a war-torn country."

The spirit falls silent.
The green circle opens...

Simon and Adele step through --
and arrive in Zack's city,
where the first two plagues are already raging.`,
`
CHAPTER 1
FINDING ZACK

Find Zack in the infected city!

[ANY KEY – START GAME]`
];

let i = 0;
const text = document.getElementById('szoveg');

function show() { text.textContent = pages[i]; }

document.addEventListener('keydown', e => {
  if (i < pages.length - 1) { i++; show(); }
  else { location.href = 'greeneye-1.html'; } // ← your game's file name!
});

show();
</script>
</body>
</html>
